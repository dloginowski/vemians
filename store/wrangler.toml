#
# The public storefront Worker.
#
#   vemians.com  public catalog, no Cloudflare Access, anyone can view
#
# The employee area is a separate package and a separate Worker: ../ops, name
# `vemians-ops`. Cloudflare Access attaches to a WHOLE Worker, not to a route
# inside one, so the two surfaces cannot share a deployment — gating this one
# would put a login page in front of the shop. What the two DO share lives in
# ../shared: the design tokens, the seed catalog, the page shell and the commerce
# adapter. Nothing else crosses — and see the binding note at the foot of this
# file for the one store both Workers touch.
#
# Custom Domains, not Routes: a Custom Domain creates and manages the proxied
# DNS record for you, which is what lets Access sit in front of the ops
# hostname. The click-path is docs/deploy-cloudflare.md.
#
name = "vemians-storefront"
main = "src/index.js"
compatibility_date = "2026-09-07"

# Serve shared/design/*.css as text modules, so the grid and the tokens are
# imported byte-for-byte from where they are maintained rather than copied into
# a template and left to drift.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# The browser-side enhancement layer, same idea. shared/view/enhance.client.js
# is BROWSER code, not Worker code: it is imported as text and served verbatim
# at /s.js. The `.client.js` extension exists so the bundler cannot mistake it
# for a module this Worker executes — a `**/*.js` glob here would swallow the
# Worker's own source.
[[rules]]
type = "Text"
globs = ["**/*.client.js"]
fallthrough = true

[vars]
# Pins this deployment to the public surface. This package contains no ops code
# at all — access.js, agent.js, mcp.js and tools/ are in ../ops — so /ops is a
# 404 here by construction. SURFACE stays as the declared identity of the
# deployment, and src/index.js refuses to serve anything if it is ever set to
# "ops": a build meant for the employee area must not answer as the shop.
PUBLIC_HOST = "vemians.com"
SURFACE     = "public"

# ---------------------------------------------------------------------------
# Custom Domains. Commented out because `wrangler deploy` will try to create
# them, which fails until the zone is on Cloudflare (deploy-cloudflare.md §1).
# Uncomment once the nameservers have moved, then deploy.
#
# [[routes]]
# pattern      = "vemians.com"
# custom_domain = true
#
# [[routes]]
# pattern      = "www.vemians.com"
# custom_domain = true

# ---------------------------------------------------------------------------
# ONE D1 BINDING ON THIS WORKER: `catalog_mirror`, AND NOTHING ELSE EVER.
#
# THIS BLOCK USED TO SAY "no D1 bindings, and none coming", and the test
# asserted zero. That was the right instinct stated as the wrong rule. The
# invariant's PURPOSE is that the shop cannot reach customer data; "zero
# bindings" was the mechanism that happened to deliver it, and mechanisms
# stated as rules eventually block the thing they were protecting. This is that
# moment.
#
# What changed: the storefront now renders OUR MIRROR of Square's catalog
# (../shared/commerce/square/schema.sql, ADR-009) instead of a hardcoded seed
# list of invented products. That store holds products, prices, categories and
# image references — public facts, already on the page, printed on a receipt at
# the counter. Reading them is not a widening of what the shop can see. And it
# is the ONLY way to satisfy ADR-009's anti-pattern table, which forbids the
# storefront calling Square per request: a read path can only be local if there
# is something local to read.
#
# What did NOT change, and is now stated as an ALLOW-LIST rather than a ban:
#
#   allowed here:  CATALOG_MIRROR                     (this file, read only)
#   ops ONLY:      CUSTOMERS, IDENTITY, COMMERCE, PEOPLE, FINANCE, AUDIT, TICKETS
#
# store/test/storefront.test.mjs names all seven of those explicitly and fails
# if any appears in this file, so adding one is a red suite rather than a review
# someone skims (Test-PRD-P0-24-binding_scoped_tools). The storefront also holds
# no write: src/catalog.js issues one SELECT against the index views and there
# is no INSERT, UPDATE or DELETE anywhere in this package.
#
# The database_id below is a PLACEHOLDER — the database does not exist on the
# account yet. `wrangler dev --local` and `wrangler deploy --dry-run` accept it;
# a real deploy will not, and should not. Create it once and paste the SAME id
# here and in ../ops/wrangler.toml, which is where it is written:
#
#   npx wrangler d1 create vemians-catalog-mirror
#
# With the mirror empty, unmigrated or absent, the shop serves ../shared/seed
# and says so at INFO (Test-PRD-P0-49-mirror_or_seed) — which is also why
# `wrangler dev --local` needs no Square account and no local database.
#
# The other schemas live in ../shared/db/*.sql and are applied from ../ops,
# which is where their bindings are: `npm run db:local` there. The mirror's
# schema is applied HERE, against this package's own local state:
#
#   npm run db:local            (in store/)

[[d1_databases]]
binding       = "CATALOG_MIRROR"
database_name = "vemians-catalog-mirror"
database_id   = "53ecdc0e-6726-40fe-bf9a-1a3be8b2506e"

[observability]
enabled = true

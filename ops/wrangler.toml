#
# The agentic staff Worker.
#
#   ops.vemians.com  employee area, behind Cloudflare Access
#
# The storefront is a separate package and a separate Worker: ../store, name
# `vemians-storefront`. Cloudflare Access attaches to a WHOLE Worker, not to a
# route inside one, so the two surfaces cannot share a deployment — gating a
# shared Worker would put a login page in front of the shop. Attach
# ops.vemians.com as a Custom Domain on THIS Worker, and put the Access
# application on this Worker only.
#
# Custom Domains, not Routes: a Custom Domain creates and manages the proxied
# DNS record for you, which is what lets Access sit in front of the hostname.
# The click-path is docs/deploy-cloudflare.md.
#
name = "vemians-ops"
main = "src/index.js"

# No public workers.dev URL for the staff surface. It is reachable only through
# the Custom Domain that Cloudflare Access sits in front of. A convenience URL
# outside the gate is exactly the thing the gate exists to prevent.
workers_dev = false
compatibility_date = "2026-09-07"
# The Square adapter derives uuids with node:crypto (shared/commerce/square/ids.js),
# which the agent catalog-authoring tools reach through. nodejs_compat is what
# makes that import resolve on Workers rather than at the first request.
compatibility_flags = ["nodejs_compat"]

# Serve shared/design/*.css as text modules, so the tokens are imported
# byte-for-byte from where they are maintained rather than copied into a
# template and left to drift.
[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.md"]
fallthrough = true

# *.md is here for skills/<name>/SKILL.md (Test-PRD-P0-54-skill_discovery).
# A connecting agent reads the skill text from the bundle, so what it reads is
# byte-for-byte what is in the repository at deploy time — there is no second
# copy to drift, which is the same reason the design tokens are imported.

[vars]
# Hostname routing. SURFACE pins this deployment to the employee area; unset it
# and src/index.js falls back to OPS_HOST plus localhost, which is what
# `wrangler dev` uses. Set to "public" and this Worker serves nothing at all.
OPS_HOST = "ops.vemians.com"
SURFACE  = "ops"

# Cloudflare Access POLICY -> role. This is what the token actually carries:
# Access Groups gate which policy admits you and are NOT claims, so `policy_id`
# is the only thing to key on. Verified by asking a real assertion what it held.
#
# Access evaluates by precedence and stops at the first match, so the ORDER of
# the policies matters more than these ids do — owner sits at precedence 1
# ahead of the staff catch-all. .github/workflows/setup-policies.yml owns that
# ordering and prints it before and after.
#
# Not secrets: a policy id identifies a rule, not a person, and grants nothing
# on its own.
OWNER_POLICY_ID = "56e4eee0-443b-4d80-ae5d-8ce00ee037b5"
STAFF_POLICY_ID = "f6e1649c-68af-4152-b93b-29341f7024f4"

# DEFAULT_ROLE IS GONE, and that is the point of the two lines above. It granted
# owner to everyone Cloudflare Access admitted — fine while one person had an
# account, wrong the day a second did. Roles are now granted by the policy that
# let you in, and someone in no role-bearing policy gets nothing.

# Cloudflare Access group -> role (P0-23). Defaults are these exact names, so
# set them only if the Workspace groups are called something else. Roles are
# never assigned in the application; renaming a group is a var change here.
# OWNER_GROUP   = "vemians-owner"
# MANAGER_GROUP = "vemians-manager"
# STAFF_GROUP   = "vemians-staff"

# Cloudflare Access assertion verification. Unset in the prototype: the Worker
# still FAILS CLOSED when the Cf-Access-Jwt-Assertion header is absent, but it
# decodes the assertion without checking the signature and says so on screen.
# Fill both in before ops.vemians.com is reachable from the internet.
#
#   ACCESS_TEAM_DOMAIN  your Zero Trust team domain
#   ACCESS_AUD          the Application Audience (AUD) tag from the Access
#                       application's Overview page
#
# IT IS "vonvemian", NOT "vemians". The team name is chosen once when Zero
# Trust is set up and has nothing to do with the zone; this was assumed to
# match the domain and did not. The consequence was total and silent: the
# Worker fetched signing keys from vemians.cloudflareaccess.com, which 404s
# because no such team exists, and so rejected EVERY genuine login as an
# assertion that failed verification. Confirmed by asking both hosts —
# vemians 404, vonvemian answers with 2 keys.
ACCESS_TEAM_DOMAIN = "vonvemian.cloudflareaccess.com"
ACCESS_AUD         = "8bacd393c1fededc1d257745149eb6d0cc0797a762941d1421a5a8a3c108018f"

# ---------------------------------------------------------------------------
# Square, for agentic catalog authoring (ADR-009). The agent writes to SQUARE —
# the same target the till writes to — and our mirror follows by sync. Set the
# token as a SECRET, never as a var:
#
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#
# SQUARE_ENV is "sandbox" or "production"; client.js refuses anything else.
#
# IT IS SET EXPLICITLY, and that is the point. client.js defaults it to
# "sandbox" when unset, and an unset value is indistinguishable from a chosen
# one — so it is chosen here, out loud.
#
# NOW PRODUCTION — the owner's real Square account, real catalog, real money.
# This value and the SQUARE_ACCESS_TOKEN secret's own value MUST name the same
# Square, or the error that comes back blames the credential when the mismatch
# is actually here (or vice versa) — this file already earned that lesson once
# (commit "SQUARE_ENV = sandbox, to match the token that is actually set").
#
# THIS WAS SET IN THE CLOUDFLARE DASHBOARD BEFORE IT WAS SET HERE. `wrangler
# deploy` overwrites `[vars]` on every deploy to match this file — a dashboard
# edit that never reaches the repo is undone by the next ops deploy, silently.
# This line is what makes the dashboard change permanent.
SQUARE_ENV = "production"

# SQUARE_LOCATION_ID is Square's single location (ADR-009 open question 2,
# answered: one) — confirmed from the Square Seller Dashboard.
SQUARE_LOCATION_ID = "L846PQNSM9TF4"

# LOCATION_ID is OURS, not Square's: the id of the one row in COMMERCE's own
# `location` table (shared/db/commerce.sql). That row does not create itself —
# seeded once by the seed-location workflow (.github/workflows/seed-location.yml),
# not by this file. Swapping this with SQUARE_LOCATION_ID above writes a Square
# vendor id into a stock ledger row, which is why they are named apart rather
# than sharing one var. Plain var, not a secret — it is not a credential on
# its own.
LOCATION_ID = "main"

# ---------------------------------------------------------------------------
# Square webhooks — the PUSH half of the mirror sync (ADR-009: "mirrored...
# on webhook and on a nightly reconcile"). src/index.js's squareWebhook
# verifies and consumes catalog.version.updated / inventory.count.updated at
# POST /webhooks/square, triggering the same syncFromSquare the cron below
# calls on a schedule — the reconcile stays as the safety net for whatever a
# webhook delivery misses, not the primary path once this is live.
#
# TWO THINGS MUST EXIST BEFORE SQUARE'S REQUESTS EVER REACH THIS WORKER, and
# neither is done by this file or by `wrangler deploy`:
#
#   1. A Cloudflare Access "Bypass" policy scoped to the exact path
#      ops.vemians.com/webhooks/square, in the Zero Trust dashboard. Access
#      gates the WHOLE ops.vemians.com host (this file's own note on
#      [[routes]] below, and index.js's own top comment: "fails closed") —
#      without a bypass for this one path, Square's POST never gets past
#      Cloudflare's edge to run any code at all, and every attempt answers
#      401 with no assertion to check, same as any other unauthenticated
#      request to this host.
#   2. A webhook subscription created in Square's own (production) Developer
#      Dashboard, pointed at https://ops.vemians.com/webhooks/square, for
#      event types catalog.version.updated and inventory.count.updated.
#      Creating it there is what mints the signature key below — it is
#      generated per subscription, not chosen.
#
# Set as a SECRET, never a var — this key signs every payload Square ever
# sends here, and a log line or a repo commit is not where it belongs:
#
#   npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY
#
# SQUARE_WEBHOOK_URL is a plain var, not a secret, but it is NOT decorative:
# webhooks.js signs over notificationUrl + rawBody, and that URL is the one
# Square's own dashboard has on file for this subscription, character for
# character (scheme, host, path, no trailing slash) — reconstructing it from
# the incoming request instead is how verification passes in a dev tunnel
# and fails in production, the exact trap webhooks.js's own top comment
# warns about.
SQUARE_WEBHOOK_URL = "https://ops.vemians.com/webhooks/square"

# ---------------------------------------------------------------------------
# Custom Domain. The zone is on Cloudflare: vemians.com, www.vemians.com and
# staging.vemians.com all deploy and answer 200 today (deploy-workers.yml runs
# #32-41), so the precondition this used to be commented out for no longer
# holds. `deploy-cloudflare.md` §3 still describes attaching this one by hand
# in the dashboard because that is how it was first done for the other three
# hostnames — this stanza is the same result, declared in code instead, so a
# redeploy cannot silently lose the attachment the way a dashboard click can.
#
# Uncommented but NOT YET DEPLOYED as of this commit — deploying it attaches
# a public Custom Domain on live infrastructure, which is worth a deliberate
# `wrangler deploy` (or a deploy-workers.yml run) rather than happening as a
# side effect of an unrelated push. It also does nothing on its own for
# Access: `deploy-cloudflare.md` §4-8 (Zero Trust, One-time PIN login, the
# Access application and its AUD tag) are separate dashboard steps this
# file cannot do or verify, and until they exist every request here answers
# 401 with no assertion to check — the documented, correct resting state.
[[routes]]
pattern      = "ops.vemians.com"
custom_domain = true

# ---------------------------------------------------------------------------
# Pending T2 approvals for POST /mcp (ADR-007). A T2 tool called over MCP parks
# its intent here and returns a link; the write happens when a human approves it
# in a browser. WITHOUT this binding the intents live in a per-isolate Map and an
# approval link dies with its isolate — fine for `wrangler dev`, a launch blocker
# for ops.vemians.com. The Worker logs a WARNING on every T2 call until it exists.
#
# Created and resolved by .github/workflows/bootstrap-resources.yml, the same
# way the D1 ids are — the placeholder below is not a UUID, so that workflow's
# check refuses to deploy against it.

# LIVE FORM, written in by bootstrap-resources.yml once the namespace exists.
# It is commented here on purpose: wrangler rejects a binding whose namespace
# id is not real (code 10042) and takes the WHOLE ops deploy down with it, so a
# placeholder here is not a harmless marker — it is an outage. The Worker
# already degrades without this binding, loudly, to a per-isolate Map.
#
[[kv_namespaces]]
binding = "APPROVALS"
id      = "29ad4b3d8fb340ab960cd248fa5df609"

# ---------------------------------------------------------------------------
# Signing key for media upload tickets (ops/src/tools/media.js). A tool argument
# cannot carry a phone photograph — the base64 would have to be emitted by the
# model — so catalog.upload_image mints a key, signs it, and hands the human a
# link to open in the browser. Without this secret the tool refuses to issue a
# link rather than issuing an unsigned one:
#
#   npx wrangler secret put MEDIA_SIGNING_KEY

# ---------------------------------------------------------------------------
# The scheduled mirror sync (Test-PRD-P0-48-scheduled_mirror_sync).
#
# src/sync.js pulls Square's catalog and inventory through the adapter and
# writes the CATALOG_MIRROR store below. Without this trigger the adapter is
# code nothing runs, and the mirror the storefront reads stays empty.
#
# THE CATALOG SYNC ITSELF IS NOW NIGHTLY ("0 3 * * *", src/sync.js's own
# SYNC_CRON) — the owner's own words, once the webhook actually started
# working: "why don't you just have them pushed... you shouldn't have to get
# everything." Every fifteen minutes was the STARTING value, back when a sync
# nobody could watch was a sync nobody trusted and nothing else told the
# mirror a change had happened at all. That is no longer true: the webhook
# (POST /webhooks/square) pushes a change into the mirror within seconds of
# it landing in Square, and this cron is now exactly the reconcile cadence
# ADR-009 always described — a nightly full sweep catching whatever a webhook
# delivery missed, not the primary path. Re-listing the whole catalog four
# times an hour to catch a change the webhook already delivered was paying
# Square's rate limiter for nothing.
#
# THE FIFTEEN-MINUTE TRIGGER STAYS ("*/15 * * * *", src/sync.js's own
# FREQUENT_CRON) — it never actually belonged to the catalog sync. Media
# backfill (P0-73) and contact-form intake (P0-100) only ever rode along on
# this schedule because it was the one cron trigger this Worker had; dropping
# it to nightly for the catalog's own sake would have dropped those two
# unrelated features to nightly right alongside it, entirely as a side
# effect — a customer's contact-form submission waiting up to a day to
# become a ticket a member of staff can see. index.js's own `scheduled`
# checks which of these two cron strings actually fired and only runs the
# step(s) that schedule owns.
[triggers]
crons = ["0 3 * * *", "*/15 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# R2 — our photographic originals, and the authoritative copy of them
# (Test-PRD-P0-28-image_contract, Test-PRD-P0-29-exit_test, Test-PRD-P0-73-
# real_photography). Square gets a copy so the item looks right on the till;
# losing Square must not lose our photography, which is only true while the
# original never lived only there. It is also what lets the STOREFRONT show a
# real photograph at all: store/src/catalog.js builds an <img src> straight
# from a media_key in the mirror, at this bucket's own public custom domain
# (media.vemians.com) — never a fetch of its own, and never Square's CDN.
#
# ADR-013 dropped this bucket; the ADR's own text says binding one back later
# "restores the original behaviour with no code change" — mediaStoreFor(env)
# already picks R2 the instant this binding is live, and
# ops/src/media-backfill.js already exists to fill it in from whatever
# Square holds. Created by .github/workflows/bootstrap-media.yml (kept
# separate from bootstrap-resources.yml on purpose — see that workflow's own
# header for why an R2 step that fails must not take the KV namespaces down
# with it). An R2 binding is by NAME, not by id, so there is nothing to
# resolve afterwards — the bucket either exists or the deploy says so.

# LIVE FORM, written in by bootstrap-media.yml once the bucket exists.
# Same reason as APPROVALS above: a binding to a bucket that does not exist
# fails the deploy rather than degrading.
#
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "vemians-media"

# ---------------------------------------------------------------------------
# The employee asset drop site's original bytes (ops/src/tools/assets.js).
# NOT an R2 bucket, ON PURPOSE: ADR-013 dropped this ops Worker's one R2
# bucket after two failed workflow runs and a token permission that was never
# granted, and reintroducing R2 for a second, unrelated feature would risk
# hitting the exact same account-level wall. KV is already live here —
# APPROVALS above is the proof — and a KV value holds up to 25 MB, comfortably
# past CAPS.ASSET_MAX_BYTES (20 MB) for a document rather than a video.
#
# Created and resolved by .github/workflows/bootstrap-resources.yml, the same
# way APPROVALS is. Commented for the same reason: a binding to a namespace
# that does not exist fails the deploy rather than degrading. Without this
# binding the upload route refuses with 503 rather than accepting a file it
# cannot actually keep.
#
[[kv_namespaces]]
binding = "ASSET_FILES"
id      = "dcdc9d082ba5472b9accd36639398db3"

# ---------------------------------------------------------------------------
# The expense receipt scanner's original photos (ops/src/tools/finance.js).
# Its OWN KV namespace — never ASSET_FILES — for the same reason a receipt
# never lands in the CUSTOMERS store: a financial record and a working
# document do not share a blast radius (agent-tool-contract rule 6).
#
# Created and resolved by .github/workflows/bootstrap-resources.yml, the same
# way APPROVALS and ASSET_FILES are. Commented for the same reason: a binding
# to a namespace that does not exist fails the deploy rather than degrading.
#
[[kv_namespaces]]
binding = "RECEIPT_FILES"
id      = "55305dca477d4f2cb7b8385d07641afb"

# ---------------------------------------------------------------------------
# Workers AI — reads a receipt photo for the expense scanner
# (ops/src/tools/receipt-ocr.js). A native Cloudflare binding, not a third
# vendor: no separate account, no API key to rotate, usage billed on this
# same Cloudflare account. Nothing else in this Worker uses it, and nothing
# here trusts what it reads — receipt-ocr.js's own header says plainly that
# the exact model id and request shape are UNVERIFIED against a live account
# (the same developers.cloudflare.com wall ADR-007 already hit), and every
# field it produces reaches a human confirm page before it is filed, never
# an INSERT (finance-skills rule 4).
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# D1 bindings.
#
# These blocks are the enforcement behind Test-PRD-P0-24-binding_scoped_tools.
# The eight stores below — customers, identity, commerce, people, finance,
# audit, tickets, assets — are bound HERE AND NOWHERE ELSE: a customer profile is not
# reachable from the storefront by any code path, because the binding does not
# exist there and neither does the code. That is the whole reason the two
# surfaces are two Workers: scope is structural, not a query filter.
#
# The ONE store that is bound on both is CATALOG_MIRROR, at the foot of this
# file. It holds products, prices and categories — public facts that are already
# on the page — and the storefront reads it to render the shop
# (Test-PRD-P0-37-mirror_is_ours). The rule the invariant enforces is "the shop
# cannot reach customer data", and ../store/wrangler.toml states the allow-list
# with the other seven named, so adding one there fails a check rather than
# passing a review.
#
# Inside this Worker the scoping continues in src/tools/index.js: a tool
# declares the stores it needs and `scopedStores()` hands its `run` exactly
# those handles. STORE_BINDINGS there has no `identity` entry, so no tool in the
# registry can reach the vault even though IDENTITY is bound below — binding it
# here is a deployment decision, reaching it is a registry decision, and both
# have to be taken deliberately.
#
# The ids below are the real ones for this account, resolved by the
# bootstrap-d1 workflow. Load the schemas into the LOCAL databases with:
#
#   npm run db:local            (migrations/apply-local.sh)
#
# which uses --local throughout and never touches a real database.

[[d1_databases]]
binding       = "CUSTOMERS"          # profile, fit, consent, version log. No identifiers.
database_name = "vemians-customers"
database_id   = "78b8dd1b-86b1-4e3c-98d8-57a3cfa59720"

[[d1_databases]]
binding       = "COMMERCE"           # orders, lines, inventory
database_name = "vemians-commerce"
database_id   = "05c238a1-a580-435c-999c-e3c63bf82571"

[[d1_databases]]
binding       = "PEOPLE"             # employees, shifts. Tightest Access policy of the seven.
database_name = "vemians-people"
database_id   = "b8fca30d-3a95-4962-b5cd-981df4636496"

[[d1_databases]]
binding       = "FINANCE"            # expenses, budgets, vendors
database_name = "vemians-finance"
database_id   = "335e217f-4080-4dca-ac29-22cf6461628f"

[[d1_databases]]
binding       = "AUDIT"              # append-only agent record; insert-only credentials
database_name = "vemians-audit"
database_id   = "178ae750-75b0-479b-bbed-14ddb2e5035a"

[[d1_databases]]
binding       = "TICKETS"            # company-wide issues; closed, never deleted
database_name = "vemians-tickets"
database_id   = "9addc2c1-7f22-44be-bf93-f8e831905ce7"

# The employee asset drop site's index (shared/db/assets.sql) — filename,
# uploader, extracted text. NOT YET CREATED: added to the bootstrap-d1
# workflow's $DBS list, but that run has not happened yet, so the id below is
# a PLACEHOLDER rather than the real UUID every store above already has.
# `wrangler deploy` will fail loudly on it rather than silently accepting it
# (bootstrap-d1.yml's own id-resolution step checks for exactly this shape).
[[d1_databases]]
binding       = "ASSETS"             # asset-drop-site index; append-only, see shared/db/assets.sql
database_name = "vemians-assets"
database_id   = "e8788eab-50b1-4639-a7a1-9bde14bc8005"

# Our copy of Square's authoritative catalog (shared/commerce/square/schema.sql,
# ADR-009). READ by the agent tools — the closed set of categories, the price
# band a suggestion is measured against, a product by handle. NOT written by
# them: a catalog write goes to Square, and this store follows by sync and
# webhook, because the till writes here too and two writers into one copy
# diverge silently. Create it with:
#
#   npx wrangler d1 create vemians-catalog-mirror
#
# The storefront binds this SAME database read-only (../store/wrangler.toml) —
# both ids move together.
#
# migrations_dir: THE ONLY store with schema changes automated in CI. Every
# other [[d1_databases]] binding in this file still follows apply-local.sh's
# own documented convention — a production schema change is `wrangler d1
# execute --remote` typed by a human who meant it. catalog_mirror earned the
# exception because it is the one store that keeps changing shape as this
# feature set grows (custom_fields, then style_id/vendor, then commission,
# then the vendor entity split) — the owner's own words, after hand-running
# the same kind of fix a third time: "having to manually run shit every time
# I add a custom field is unacceptable." `ops/migrations/catalog_mirror/`
# holds the ordered, forward-only delta files; `deploy-workers.yml` runs
# `wrangler d1 migrations apply` against them on every push to main, BEFORE
# the Worker code that expects the new shape goes live. shared/commerce/
# square/schema.sql remains the single canonical FULL schema — tests and
# local dev (apply-local.sh) still load it whole, unchanged — the migrations
# directory is purely the ordered application LOG for production. See
# ops/migrations/catalog_mirror/README.md for the rule this imposes on every
# future schema.sql change.
[[d1_databases]]
binding        = "CATALOG_MIRROR"
database_name  = "vemians-catalog-mirror"
database_id    = "53ecdc0e-6726-40fe-bf9a-1a3be8b2506e"
migrations_dir = "migrations/catalog_mirror"

# The vault. Bound here so the erasure and clienteling workflows have somewhere
# to land when they are built (identity-skills says build them LAST), and
# reachable by no tool until STORE_BINDINGS in src/tools/index.js gains an
# `identity` entry. Its own Cloudflare Access policy gates the routes that use
# it, separately from general staff access.
[[d1_databases]]
binding       = "IDENTITY"           # ciphertext name/email/phone under an external KEK
database_name = "vemians-identity"
database_id   = "ad42f20e-f3af-47c9-9022-09c318ec68ec"

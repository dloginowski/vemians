#
# The agentic staff Worker.
#
#   ops.vemians.com  employee area, behind Cloudflare Access
#
# The storefront is a separate package and a separate Worker: ../store, name
# `vemians-storefront`. Cloudflare Access attaches to a WHOLE Worker, not to a
# route inside one, so the two surfaces cannot share a deployment — gating a
# shared Worker would put a login page in front of the shop. Attach
# ops.vemians.com as a Custom Domain on THIS Worker, and put the Access
# application on this Worker only.
#
# Custom Domains, not Routes: a Custom Domain creates and manages the proxied
# DNS record for you, which is what lets Access sit in front of the hostname.
# The click-path is docs/deploy-cloudflare.md.
#
name = "vemians-ops"
main = "src/index.js"

# No public workers.dev URL for the staff surface. It is reachable only through
# the Custom Domain that Cloudflare Access sits in front of. A convenience URL
# outside the gate is exactly the thing the gate exists to prevent.
workers_dev = false
compatibility_date = "2026-09-07"
# The Square adapter derives uuids with node:crypto (shared/commerce/square/ids.js),
# which the agent catalog-authoring tools reach through. nodejs_compat is what
# makes that import resolve on Workers rather than at the first request.
compatibility_flags = ["nodejs_compat"]

# Serve shared/design/*.css as text modules, so the tokens are imported
# byte-for-byte from where they are maintained rather than copied into a
# template and left to drift.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[vars]
# Hostname routing. SURFACE pins this deployment to the employee area; unset it
# and src/index.js falls back to OPS_HOST plus localhost, which is what
# `wrangler dev` uses. Set to "public" and this Worker serves nothing at all.
OPS_HOST = "ops.vemians.com"
SURFACE  = "ops"

# Cloudflare Access group -> role (P0-23). Defaults are these exact names, so
# set them only if the Workspace groups are called something else. Roles are
# never assigned in the application; renaming a group is a var change here.
# OWNER_GROUP   = "vemians-owner"
# MANAGER_GROUP = "vemians-manager"
# STAFF_GROUP   = "vemians-staff"

# Cloudflare Access assertion verification. Unset in the prototype: the Worker
# still FAILS CLOSED when the Cf-Access-Jwt-Assertion header is absent, but it
# decodes the assertion without checking the signature and says so on screen.
# Fill both in before ops.vemians.com is reachable from the internet.
#
#   ACCESS_TEAM_DOMAIN  your Zero Trust team domain
#   ACCESS_AUD          the Application Audience (AUD) tag from the Access
#                       application's Overview page
#
# IT IS "vonvemian", NOT "vemians". The team name is chosen once when Zero
# Trust is set up and has nothing to do with the zone; this was assumed to
# match the domain and did not. The consequence was total and silent: the
# Worker fetched signing keys from vemians.cloudflareaccess.com, which 404s
# because no such team exists, and so rejected EVERY genuine login as an
# assertion that failed verification. Confirmed by asking both hosts —
# vemians 404, vonvemian answers with 2 keys.
ACCESS_TEAM_DOMAIN = "vonvemian.cloudflareaccess.com"
ACCESS_AUD         = "8bacd393c1fededc1d257745149eb6d0cc0797a762941d1421a5a8a3c108018f"

# ---------------------------------------------------------------------------
# Custom Domain. Commented out because `wrangler deploy` will try to create it,
# which fails until the zone is on Cloudflare (deploy-cloudflare.md §1).
# Uncomment once the nameservers have moved, then deploy.
#
# [[routes]]
# pattern      = "ops.vemians.com"
# custom_domain = true

# ---------------------------------------------------------------------------
# Pending T2 approvals for POST /mcp (ADR-007). A T2 tool called over MCP parks
# its intent here and returns a link; the write happens when a human approves it
# in a browser. WITHOUT this binding the intents live in a per-isolate Map and an
# approval link dies with its isolate — fine for `wrangler dev`, a launch blocker
# for ops.vemians.com. The Worker logs a WARNING on every T2 call until it exists.
#
#   npx wrangler kv namespace create vemians-approvals
#
# [[kv_namespaces]]
# binding = "APPROVALS"
# id      = "<id>"

# ---------------------------------------------------------------------------
# Square, for agentic catalog authoring (ADR-009). The agent writes to SQUARE —
# the same target the till writes to — and our mirror follows by sync. Set the
# token as a SECRET, never as a var:
#
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#
# SQUARE_ENV is "sandbox" or "production"; client.js refuses anything else.
#
# IT IS SET EXPLICITLY, and that is the point. client.js defaults it to
# "sandbox" when unset, so an unset SQUARE_ENV sent a PRODUCTION token to
# connect.squareupsandbox.com, where Square rejected it — a wrong-credential
# error for a right credential, pointing at the token rather than at the two
# words of configuration actually missing. A live shop is production; flip this
# to "sandbox" to test, and remember the TOKEN has to be the matching one.
SQUARE_ENV = "production"
#
# SQUARE_LOCATION_ID is Square's single location (ADR-009 open question 2,
# answered: one). LOCATION_ID is OURS, the uuid on a stock ledger row — the two
# are different identifiers and swapping them writes a vendor id into a row.
# Neither is set yet: the catalog sweep does not need them, the stock half and
# checkout do, and both say so by name rather than failing vaguely.
#
# SQUARE_LOCATION_ID = "<Square location id>"
# LOCATION_ID        = "<our location uuid>"

# ---------------------------------------------------------------------------
# Signing key for media upload tickets (ops/src/tools/media.js). A tool argument
# cannot carry a phone photograph — the base64 would have to be emitted by the
# model — so catalog.upload_image mints a key, signs it, and hands the human a
# link to open in the browser. Without this secret the tool refuses to issue a
# link rather than issuing an unsigned one:
#
#   npx wrangler secret put MEDIA_SIGNING_KEY

# ---------------------------------------------------------------------------
# The scheduled mirror sync (Test-PRD-P0-48-scheduled_mirror_sync).
#
# src/sync.js pulls Square's catalog and inventory through the adapter and
# writes the CATALOG_MIRROR store below. Without this trigger the adapter is
# code nothing runs, and the mirror the storefront reads stays empty.
#
# EVERY FIFTEEN MINUTES IS A STARTING VALUE, NOT THE INTENDED ONE. It is here
# because a sync nobody can watch is a sync nobody trusts: at this rate a
# `wrangler tail` shows a run within a coffee, and a wrong token or an unbound
# store is found the same afternoon rather than the next morning. Once it has
# run clean for a few days, DROP IT TO NIGHTLY — "0 3 * * *" — which is the
# reconcile cadence ADR-009 actually describes; the webhook is what keeps the
# mirror current between reconciles, and re-listing a whole catalog four times
# an hour to catch a price change that arrives by webhook anyway is paying
# Square's rate limiter for nothing.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# R2 — our photographic originals, and the authoritative copy of them
# (Test-PRD-P0-28-image_contract, Test-PRD-P0-29-exit_test). Square gets a copy
# so the item looks right on the till; losing Square must not lose our
# photography, which is only true while the original never lived only there.
#
#   npx wrangler r2 bucket create vemians-media
#
# [[r2_buckets]]
# binding     = "MEDIA"
# bucket_name = "vemians-media"

# ---------------------------------------------------------------------------
# D1 bindings.
#
# These blocks are the enforcement behind Test-PRD-P0-24-binding_scoped_tools.
# The seven stores below — customers, identity, commerce, people, finance,
# audit, tickets — are bound HERE AND NOWHERE ELSE: a customer profile is not
# reachable from the storefront by any code path, because the binding does not
# exist there and neither does the code. That is the whole reason the two
# surfaces are two Workers: scope is structural, not a query filter.
#
# The ONE store that is bound on both is CATALOG_MIRROR, at the foot of this
# file. It holds products, prices and categories — public facts that are already
# on the page — and the storefront reads it to render the shop
# (Test-PRD-P0-37-mirror_is_ours). The rule the invariant enforces is "the shop
# cannot reach customer data", and ../store/wrangler.toml states the allow-list
# with the other seven named, so adding one there fails a check rather than
# passing a review.
#
# Inside this Worker the scoping continues in src/tools/index.js: a tool
# declares the stores it needs and `scopedStores()` hands its `run` exactly
# those handles. STORE_BINDINGS there has no `identity` entry, so no tool in the
# registry can reach the vault even though IDENTITY is bound below — binding it
# here is a deployment decision, reaching it is a registry decision, and both
# have to be taken deliberately.
#
# The ids below are the real ones for this account, resolved by the
# bootstrap-d1 workflow. Load the schemas into the LOCAL databases with:
#
#   npm run db:local            (migrations/apply-local.sh)
#
# which uses --local throughout and never touches a real database.

[[d1_databases]]
binding       = "CUSTOMERS"          # profile, fit, consent, version log. No identifiers.
database_name = "vemians-customers"
database_id   = "78b8dd1b-86b1-4e3c-98d8-57a3cfa59720"

[[d1_databases]]
binding       = "COMMERCE"           # orders, lines, inventory
database_name = "vemians-commerce"
database_id   = "05c238a1-a580-435c-999c-e3c63bf82571"

[[d1_databases]]
binding       = "PEOPLE"             # employees, shifts. Tightest Access policy of the seven.
database_name = "vemians-people"
database_id   = "b8fca30d-3a95-4962-b5cd-981df4636496"

[[d1_databases]]
binding       = "FINANCE"            # expenses, budgets, vendors
database_name = "vemians-finance"
database_id   = "335e217f-4080-4dca-ac29-22cf6461628f"

[[d1_databases]]
binding       = "AUDIT"              # append-only agent record; insert-only credentials
database_name = "vemians-audit"
database_id   = "178ae750-75b0-479b-bbed-14ddb2e5035a"

[[d1_databases]]
binding       = "TICKETS"            # company-wide issues; closed, never deleted
database_name = "vemians-tickets"
database_id   = "9addc2c1-7f22-44be-bf93-f8e831905ce7"

# Our copy of Square's authoritative catalog (shared/commerce/square/schema.sql,
# ADR-009). READ by the agent tools — the closed set of categories, the price
# band a suggestion is measured against, a product by handle. NOT written by
# them: a catalog write goes to Square, and this store follows by sync and
# webhook, because the till writes here too and two writers into one copy
# diverge silently. Create it with:
#
#   npx wrangler d1 create vemians-catalog-mirror
#
# The id below is a PLACEHOLDER: this database does not exist on the account
# yet. `wrangler dev --local` and `wrangler deploy --dry-run` are happy with it;
# a real `wrangler deploy` is not, and should not be. Replace it before the
# first deploy, and note that the storefront binds this SAME database read-only
# (../store/wrangler.toml) — both ids move together.
[[d1_databases]]
binding       = "CATALOG_MIRROR"
database_name = "vemians-catalog-mirror"
database_id   = "53ecdc0e-6726-40fe-bf9a-1a3be8b2506e"

# The vault. Bound here so the erasure and clienteling workflows have somewhere
# to land when they are built (identity-skills says build them LAST), and
# reachable by no tool until STORE_BINDINGS in src/tools/index.js gains an
# `identity` entry. Its own Cloudflare Access policy gates the routes that use
# it, separately from general staff access.
[[d1_databases]]
binding       = "IDENTITY"           # ciphertext name/email/phone under an external KEK
database_name = "vemians-identity"
database_id   = "ad42f20e-f3af-47c9-9022-09c318ec68ec"

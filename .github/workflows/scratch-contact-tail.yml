# SCRATCH, THROWAWAY DIAGNOSTIC — never merge to main.
#
# Captures live console output from the deployed vemians-storefront Worker
# for a fixed window, so a real contact-form submission's own
# console.error("ERROR store/contact: ...") reaches somewhere readable —
# this Worker's own logs are not otherwise retained anywhere (mirror-
# status.yml's own comment). Read-only: `wrangler tail` only subscribes to
# the Worker's existing log stream, it changes nothing.

name: scratch-contact-tail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store/package-lock.json

      - run: npm ci
        working-directory: store

      - name: Tail vemians-storefront for 100s — submit the contact form during this window
        working-directory: store
        run: |
          echo "Tail starting — submit the contact form on vemians.com now."
          timeout 100 npx wrangler tail vemians-storefront --format pretty > /tmp/tail.log 2>&1 || true
          echo "───────── captured output ─────────"
          cat /tmp/tail.log

# Keeps people's own `employee` table in step with Square's active Team
# list (Test-PRD-P0-101-square_sourced_roster; docs/adr/012-ops-is-a-delegate.md:
# "Square's staff list is the roster"). ops/src/access.js reads this table
# directly once it holds at least one row — no Cloudflare Access edit
# happens here at all, only a Square read and a D1 write.
#
# Run it manually from the Actions tab, or on the schedule below once you've
# confirmed a manual run does what you expect. Idempotent: an employee
# already on file is updated in place, never duplicated.

name: sync-roster-from-square

on:
  workflow_dispatch:
    inputs:
      manager_job_titles:
        description: Comma-separated Square job titles that count as manager (case-sensitive, exact match). Leave blank for owner+staff only.
        default: ""
      square_env:
        description: sandbox or production — must match the token
        default: production
  # Commented out until a manual run has been checked once. Uncomment to run
  # automatically — every 6 hours is a reasonable start; tighten or loosen
  # once you've seen how quickly Square-side changes need to reach ops.
  # schedule:
  #   - cron: "17 */6 * * *"

concurrency:
  group: sync-roster-from-square
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_ENV: ${{ inputs.square_env || 'production' }}
      MANAGER_JOB_TITLES: ${{ inputs.manager_job_titles }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Build the SQL from Square's current Team list
        run: node .github/scripts/sync-roster-from-square.mjs roster.sql

      - name: Apply it to the people database
        working-directory: ops
        run: npx wrangler d1 execute vemians-people --remote --yes --file="../roster.sql"

      - name: Show the roster now on file
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-people --remote --json \
            --command "SELECT email, name, role, is_active FROM employee ORDER BY role DESC, email"

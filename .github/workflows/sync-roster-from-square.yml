# Keeps people's own `employee` table in step with Square's active Team
# list (Test-PRD-P0-101-square_sourced_roster; docs/adr/012-ops-is-a-delegate.md:
# "Square's staff list is the roster"). ops/src/access.js reads this table
# directly once it holds at least one row, deciding what someone can do once
# they're in. The same Square read also keeps the Cloudflare Access login
# gate's Include list current — who can get in at all — once `setup-access`
# has created the application and policy one time; see sync-roster-from-square.mjs.
#
# Runs automatically, every 6 hours — the owner's own words: "I want it all
# to propagate automatically." Also runnable by hand from the Actions tab at
# any time (e.g. right after changing MANAGER_JOB_TITLES). Idempotent: an
# employee already on file is updated in place, never duplicated.
#
# A scheduled run carries no workflow_dispatch inputs at all — GitHub simply
# does not populate `inputs` for a `schedule` trigger — so MANAGER_JOB_TITLES
# for an automatic run comes from the MANAGER_JOB_TITLES repository variable
# (Settings -> Secrets and variables -> Actions -> Variables) instead, with
# the manual input taking precedence when this is run by hand with one filled
# in. Unset either way defaults to owner+staff only, same as before.

name: sync-roster-from-square

on:
  workflow_dispatch:
    inputs:
      manager_job_titles:
        description: Comma-separated Square job titles that count as manager (case-sensitive, exact match). Leave blank to use the MANAGER_JOB_TITLES repo variable, or for owner+staff only if that is unset too.
        default: ""
      square_env:
        description: sandbox or production — must match the token
        default: production
      zone:
        description: The domain (used to find the ops Access application, e.g. ops.<zone>)
        default: vemians.com
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: sync-roster-from-square
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_ENV: ${{ inputs.square_env || 'production' }}
      MANAGER_JOB_TITLES: ${{ inputs.manager_job_titles || vars.MANAGER_JOB_TITLES || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: ${{ inputs.zone || 'vemians.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Build the SQL from Square's current Team list
        run: node .github/scripts/sync-roster-from-square.mjs roster.sql

      - name: Apply it to the people database
        working-directory: ops
        run: npx wrangler d1 execute vemians-people --remote --yes --file="../roster.sql"

      - name: Show the roster now on file
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-people --remote --json \
            --command "SELECT email, name, role, is_active FROM employee ORDER BY role DESC, email"

# Read-only: what does the Square mirror actually hold, and what did the last
# sync say?
#
# The cron runs on the ops Worker and writes mirror_sync whether it succeeded
# or failed. Nothing else surfaces that: the Worker's logs are not retained,
# the storefront falls back to the seed silently on purpose, and nobody here
# can reach the Cloudflare API. So this is the only way to answer "is the shop
# selling Square's catalog or the seed, and why".
#
# SELECT only. It cannot change anything, including by accident: --remote with
# a read query is the whole of it.

name: mirror-status

on:
  workflow_dispatch:

concurrency:
  group: mirror-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Last sync of each kind
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-catalog-mirror --remote --yes \
            --command "SELECT id, ran_at, ok, substr(note,1,180) AS note, CASE WHEN cursor IS NULL THEN 'none' ELSE 'set' END AS cursor FROM mirror_sync ORDER BY id" \
            > /tmp/sync.json 2>&1 || { cat /tmp/sync.json; exit 1; }
          cat /tmp/sync.json
          # Repeated at the very END of the job too. GitHub's log API hands back
          # a TAIL, so the first step's output is the first thing to fall off —
          # and this is the one row that says whether the cron ran at all.
          cp /tmp/sync.json /tmp/sync-echo.json

      - name: What the mirror holds
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-catalog-mirror --remote --yes \
            --command "SELECT (SELECT count(*) FROM mirror_product) AS products, (SELECT count(*) FROM mirror_product WHERE archived_at IS NULL) AS live_products, (SELECT count(*) FROM mirror_variant) AS variants, (SELECT count(*) FROM mirror_category) AS categories, (SELECT count(*) FROM mirror_image) AS images"

      - name: The categories, which is what the nav is built from
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-catalog-mirror --remote --yes \
            --command "SELECT name, (SELECT count(*) FROM mirror_product p WHERE p.category_id = c.id AND p.archived_at IS NULL) AS live_products FROM mirror_category c ORDER BY name"

      - name: A sample of the products
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-catalog-mirror --remote --yes \
            --command "SELECT handle, substr(title,1,50) AS title, archived_at IS NULL AS live FROM mirror_product ORDER BY handle LIMIT 20"

      - name: The last sync again, so it survives a tailed log
        if: always()
        run: |
          echo "───────── mirror_sync ─────────"
          cat /tmp/sync-echo.json 2>/dev/null || echo "(the first step did not get this far)"

      - name: Do the deployed Workers actually answer
        if: always()
        run: |
          # Never checked from here: this sandbox's proxy refuses both hosts,
          # a GitHub runner has open egress. It bears on the cron question —
          # if fetch works, the module loads and the isolate starts, so a
          # scheduled handler that never records anything is not a Worker
          # that fails at startup.
          for u in https://vemians.com/ https://www.vemians.com/ https://ops.vemians.com/; do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' --max-time 25 "$u" || echo 000)
            echo "$code  $u"
          done

          echo "───── what the shop is serving ─────"
          curl -s --max-time 25 https://vemians.com/ > /tmp/shop.html || true
          echo "bytes: $(wc -c < /tmp/shop.html)"
          # The seed's twelve invented products carry handles the real catalog
          # will not. Grep for the nav instead of guessing from the byte count.
          grep -o 'href="/?category=[^"]*"' /tmp/shop.html | sort -u || echo "(no category links found)"

      - name: Is the cron registered, and which secrets exist
        if: always()
        run: |
          # Two questions that an empty mirror_sync cannot tell apart:
          #   - the cron is not firing at all          -> no row, ever
          #   - the cron fires and Square refuses us   -> a row saying so
          # Both endpoints are read-only. The secrets endpoint returns NAMES
          # ONLY — Cloudflare will not hand back a secret's value to anyone,
          # this workflow included — and the token is passed in a header and
          # never printed.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vemians-ops"

          echo "───── cron triggers on vemians-ops ─────"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get("result") if d.get("success") else d.get("errors"), indent=2))'

          echo "───── secret NAMES on vemians-ops (no values) ─────"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/secrets" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([s.get("name") for s in d["result"]] if d.get("success") else d.get("errors"), indent=2))'

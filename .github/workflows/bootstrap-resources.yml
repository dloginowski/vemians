# Create the KV namespaces the ops Worker binds, and write their ids back into
# ops/wrangler.toml.
#
# R2 WAS HERE AND IS NOT ANY MORE. ADR-013 dropped the bucket: Square holds the
# photographs. Leaving the bucket step in place meant a permission we no longer
# need could fail the run BEFORE it reached the namespace we do need — which is
# exactly what happened, twice. The employee asset drop site (assets.js) and
# the expense receipt scanner (finance.js) both store their bytes in KV rather
# than reopening that R2 permission, for the same reason — see the ASSET_FILES
# and RECEIPT_FILES comments in ops/wrangler.toml. Two SEPARATE namespaces, on
# purpose: a working document and a financial record do not share one.
#
# Everything for agentic catalog authoring was written and none of it was
# wired: `catalog.upload_image` had no bucket to put a photograph in, and every
# T2 approval lived in isolate memory, so an approval link minted by one
# request could be gone by the next.
#
# Same shape as bootstrap-d1, and the same lessons already paid for there:
# the loop variable IS the resource name, a create that fails is not allowed to
# read as success, and anything left that is not a real id fails the step.
#
# THREE KV NAMESPACES, ONE LOOP. Title and binding travel together as
# "title:BINDING" — a KV title is not a legal binding name (the ops Worker
# calls it env.APPROVALS, not env["vemians-approvals"]) and a namespace's
# title and its binding have always been two different strings here, so the
# loop needs both, not one derived from the other.

name: bootstrap-resources

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-resources
  cancel-in-progress: false

permissions:
  contents: write

env:
  KV_NAMESPACES: "vemians-approvals:APPROVALS vemians-asset-files:ASSET_FILES vemians-receipt-files:RECEIPT_FILES"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Create the KV namespaces
        working-directory: ops
        run: |
          for pair in $KV_NAMESPACES; do
            title="${pair%%:*}"
            echo "::group::$title"
            if npx wrangler kv namespace create "$title" >/tmp/kv.log 2>&1; then
              cat /tmp/kv.log
            elif grep -qiE 'already exists|10014' /tmp/kv.log; then
              echo "$title already exists — nothing to do."
            else
              cat /tmp/kv.log
              echo "::error::could not create $title"; exit 1
            fi
            echo "::endgroup::"
          done

      - name: Activate the KV bindings
        run: |
          (cd ops && npx wrangler kv namespace list) > /tmp/kv.json
          for pair in $KV_NAMESPACES; do
            title="${pair%%:*}"
            binding="${pair##*:}"
            python3 .github/scripts/resolve-kv-id.py /tmp/kv.json ops/wrangler.toml "$title" "$binding"
          done

      - name: Commit the ids
        run: |
          if git diff --quiet -- ops/wrangler.toml; then
            echo "ops/wrangler.toml already correct — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/wrangler.toml
          git commit -m "Activate the APPROVALS, ASSET_FILES and RECEIPT_FILES KV bindings

          All three ship COMMENTED, because wrangler rejects a binding to a
          namespace that does not exist and fails the whole deploy with it.
          They are written live here, after the resources exist. MEDIA (R2)
          stays commented — ADR-013 dropped that bucket on purpose."
          git push

# One-time: create the D1 databases, apply the schemas, and write the real
# database_ids back into ops/wrangler.toml.
#
# The bindings live on the ops Worker and nowhere else, so this workflow only
# ever touches ops/. The storefront package has no d1_databases block to fix.
#
# ops/wrangler.toml ships with real ids for this account; a fresh account gets
# placeholders, and a deploy against those fails with error 10181, which is what
# this fixes. Safe to re-run: creating an existing database is treated as
# success, and the schemas use CREATE TABLE, so a second run against a populated
# database is a no-op that leaves data alone.

name: bootstrap-d1

on:
  workflow_dispatch:
    inputs:
      apply_schemas:
        description: Also apply the schemas to the remote databases
        type: boolean
        default: true

concurrency:
  group: bootstrap-d1
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit the resolved ids back

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Create the databases
        working-directory: ops
        run: |
          for s in customers identity commerce people finance audit tickets catalog_mirror; do
            echo "::group::vemians-$s"
            # Already exists is success, not failure — this must be re-runnable.
            npx wrangler d1 create "vemians-$s" 2>&1 | tee /tmp/create.log || \
              grep -qiE 'already exists|already have a database' /tmp/create.log || {
                echo "::error::could not create vemians-$s"; exit 1; }
            echo "::endgroup::"
          done

      - name: Write the real ids into wrangler.toml
        working-directory: ops
        run: |
          npx wrangler d1 list --json > /tmp/d1.json
          python3 - <<'PY'
          import json, pathlib, re, sys
          dbs = {d["name"]: d["uuid"] for d in json.load(open("/tmp/d1.json"))}
          p = pathlib.Path("wrangler.toml"); s = p.read_text(); changed = 0

          def fix(m):
              global changed
              name = m.group("name")
              real = dbs.get(name)
              if not real:
                  print(f"::warning::no database found named {name}")
                  return m.group(0)
              if m.group("id") == real:
                  return m.group(0)
              changed += 1
              print(f"  {name}: {m.group('id')[:20]}… -> {real}")
              return m.group(0).replace(m.group("id"), real)

          s = re.sub(
              r'database_name\s*=\s*"(?P<name>[^"]+)"\s*\ndatabase_id\s*=\s*"(?P<id>[^"]+)"',
              fix, s)
          p.write_text(s)
          print(f"{changed} id(s) updated")
          # Fail loudly rather than deploying against placeholders again.
          left = re.findall(r'database_id\s*=\s*"(0{8}-0{4}-0{4}-0{4}-[0-9a-f]{12})"', s)
          if left:
              print(f"::error::{len(left)} placeholder id(s) remain: {left}"); sys.exit(1)
          PY

      - name: Apply the schemas
        if: inputs.apply_schemas
        working-directory: ops
        run: |
          # catalog_mirror's schema lives beside its adapter rather than in
          # shared/db, because it is the Square adapter's own shape — so the
          # path is looked up rather than assumed.
          for s in customers identity commerce people finance audit tickets catalog_mirror; do
            case "$s" in
              catalog_mirror) f="../shared/commerce/square/schema.sql" ;;
              *)              f="../shared/db/$s.sql" ;;
            esac
            [ -f "$f" ] || { echo "::error::no schema at $f for vemians-$s"; exit 1; }
            echo "::group::schema -> vemians-$s  ($f)"
            npx wrangler d1 execute "vemians-$s" --remote --yes --file="$f" || {
              echo "::error::schema failed for vemians-$s"; exit 1; }
            echo "::endgroup::"
          done

      - name: Commit the ids
        run: |
          if git diff --quiet -- ops/wrangler.toml; then
            echo "wrangler.toml already correct — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/wrangler.toml
          git commit -m "Resolve D1 database ids from the Cloudflare account

          Replaces the placeholder ids ops/wrangler.toml ships with, which a
          deploy rejects with error 10181, using the real ids for this account."
          git push

# One-time: create the D1 databases, apply the schemas, and write the real
# database_ids back into the wrangler.toml files that bind them.
#
# TWO files bind D1, not one. ops/ binds the seven private stores; store/ binds
# catalog-mirror and only catalog-mirror (see store/wrangler.toml for why that
# allow-list replaced a zero-binding rule). A rewrite that touched only ops/
# left the storefront pointing at a placeholder and failing with error 10181 —
# the exact failure this workflow exists to prevent.
#
# The loop variable IS the database-name suffix, deliberately. An earlier
# version looped over schema keys and built the name from them, which created
# "vemians-catalog_mirror" while both toml files asked for
# "vemians-catalog-mirror" — a database that existed, was empty, and matched
# nothing.
#
# Safe to re-run: creating an existing database is success, and a database that
# already holds tables is left alone. The schemas are plain CREATE TABLE, so
# re-applying them to a populated database is an error, not a no-op.
#
# `add_channel_column` below is the LAST one-off input this file should ever
# grow for vemians-catalog-mirror. That database's schema now has its own
# automated migrations directory (ops/migrations/catalog_mirror/, applied
# automatically by deploy-workers.yml on every push to main) — a new
# catalog-mirror schema change is a new numbered file there, never a new
# boolean input here.

name: bootstrap-d1

on:
  workflow_dispatch:
    inputs:
      apply_schemas:
        description: Apply the schemas to databases that are still empty
        type: boolean
        default: true
      add_channel_column:
        description: >-
          One-off: ADD COLUMN channel to vemians-catalog-mirror's mirror_product,
          for a database that was already populated before P0-71 added the
          column to schema.sql (a fresh database gets it for free from
          apply_schemas above; this is only for one that predates it). Checks
          for the column first — safe to leave on by mistake.
        type: boolean
        default: false
      add_agent_bookkeeping_tables:
        description: >-
          One-off: CREATE the agent_last_preview and agent_batch_plan tables
          in vemians-assets, for a database that was already populated before
          Test-PRD-P0-183-durable_batch_bookkeeping added them to
          shared/db/assets.sql (a fresh database gets them for free from
          apply_schemas above; this is only for one that predates them).
          Checks for agent_last_preview first — safe to leave on by mistake,
          and safe to trigger from a phone browser with no CLI at hand.
        type: boolean
        default: false
      widen_agent_last_preview_batch_kind:
        description: >-
          One-off: widen agent_last_preview.batch_kind's own CHECK constraint
          to also allow 'attached', for a database that already has this
          table from add_agent_bookkeeping_tables above but predates
          agentTurn recording a spreadsheet attachment the moment it arrives
          (a fresh database, or one bootstrapped after this change, gets the
          wider constraint for free from apply_schemas/add_agent_bookkeeping_
          tables above). SQLite cannot ALTER a CHECK constraint in place, so
          this renames the table, recreates it with the wider constraint,
          copies every existing row across untouched, and drops the old one
          — checks the current constraint text first, safe to leave on by
          mistake, and safe to trigger from a phone browser with no CLI at
          hand.
        type: boolean
        default: false

concurrency:
  group: bootstrap-d1
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit the resolved ids back

env:
  # The database-name suffixes, exactly as the wrangler.toml files spell them.
  DBS: customers identity commerce people finance audit tickets catalog-mirror assets

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Create the databases
        working-directory: ops
        run: |
          # Checked by NAME against a real listing first, rather than by
          # guessing from `create`'s error text. This account is now at its
          # plan's D1 database cap (all nine of these already exist), and
          # Cloudflare's own error for that case is "you have reached the
          # maximum number of D1 databases" — not "already exists" — so the
          # old text-matching fallback never caught it and `create` would
          # fail this step on every future run, forever, for a database that
          # was never actually missing.
          npx wrangler d1 list --json > /tmp/existing.json
          existing=" $(python3 -c "import json; print(' '.join(d['name'] for d in json.load(open('/tmp/existing.json'))))") "
          for s in $DBS; do
            name="vemians-$s"
            echo "::group::$name"
            if [[ "$existing" == *" $name "* ]]; then
              echo "$name already exists — nothing to do."
            elif npx wrangler d1 create "$name" >/tmp/create.log 2>&1; then
              cat /tmp/create.log
            else
              cat /tmp/create.log
              echo "::error::could not create $name"; exit 1
            fi
            echo "::endgroup::"
          done

      - name: Write the real ids into both wrangler.toml files
        run: |
          (cd ops && npx wrangler d1 list --json) > /tmp/d1.json
          python3 - <<'PY'
          import json, pathlib, re, sys

          UUID = re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          dbs = {d["name"]: d["uuid"] for d in json.load(open("/tmp/d1.json"))}
          missing, changed = [], 0

          def fix(m):
              global changed
              name, cur = m.group("name"), m.group("id")
              real = dbs.get(name)
              if not real:
                  missing.append(name)
                  return m.group(0)
              if cur == real:
                  return m.group(0)
              changed += 1
              print(f"  {name}: {cur[:24]}… -> {real}")
              return m.group(0).replace(cur, real)

          pat = re.compile(
              r'database_name\s*=\s*"(?P<name>[^"]+)"\s*\ndatabase_id\s*=\s*"(?P<id>[^"]+)"')

          for f in ("ops/wrangler.toml", "store/wrangler.toml"):
              p = pathlib.Path(f)
              s = pat.sub(fix, p.read_text())
              p.write_text(s)
              # Any id that is not a UUID is a placeholder, whatever it spells.
              # The old check matched only the all-zeros shape, so
              # "PLACEHOLDER-run-wrangler-d1-create-…" passed it silently.
              bad = [i for i in re.findall(r'database_id\s*=\s*"([^"]+)"', s)
                     if not UUID.match(i)]
              if bad:
                  print(f"::error::{f} still holds unresolved id(s): {bad}")
                  sys.exit(1)

          print(f"{changed} id(s) updated")
          if missing:
              # Every name in a toml must exist by now: the create step ran
              # over the same list. A miss means the names disagree.
              print(f"::error::no database found named: {sorted(set(missing))}")
              sys.exit(1)
          PY

      - name: Apply the schemas to empty databases
        if: inputs.apply_schemas
        working-directory: ops
        run: |
          # catalog-mirror's schema lives beside its adapter rather than in
          # shared/db, because it is the Square adapter's own shape.
          for s in $DBS; do
            case "$s" in
              catalog-mirror) f="../shared/commerce/square/schema.sql" ;;
              *)              f="../shared/db/$s.sql" ;;
            esac
            [ -f "$f" ] || { echo "::error::no schema at $f for vemians-$s"; exit 1; }

            # Already populated? Leave it. These schemas are plain CREATE TABLE,
            # so re-applying one aborts on "table … already exists" and takes
            # the whole run down with it — which is how a re-run used to fail
            # on the FIRST database and never reach the new one.
            npx wrangler d1 execute "vemians-$s" --remote --yes --json \
              --command "SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" \
              > /tmp/count.json 2>/tmp/count.err || {
                cat /tmp/count.err; echo "::error::could not read vemians-$s"; exit 1; }
            n=$(python3 ../.github/scripts/d1-table-count.py /tmp/count.json)

            if [ "$n" != "0" ]; then
              echo "vemians-$s already holds $n table(s) — leaving it alone."
              continue
            fi

            echo "::group::schema -> vemians-$s  ($f)"
            npx wrangler d1 execute "vemians-$s" --remote --yes --file="$f" || {
              echo "::error::schema failed for vemians-$s"; exit 1; }
            echo "::endgroup::"
          done

      - name: Add the channel column to an already-populated catalog-mirror
        if: inputs.add_channel_column
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-catalog-mirror --remote --yes --json \
            --command "SELECT name FROM pragma_table_info('mirror_product') WHERE name = 'channel'" \
            > /tmp/col.json 2>/tmp/col.err || {
              cat /tmp/col.err; echo "::error::could not read vemians-catalog-mirror"; exit 1; }

          if python3 -c "import json,sys; r=json.load(open('/tmp/col.json')); sys.exit(0 if r[0]['results'] else 1)"; then
            echo "channel already exists on mirror_product — nothing to do."
          else
            npx wrangler d1 execute vemians-catalog-mirror --remote --yes \
              --command "ALTER TABLE mirror_product ADD COLUMN channel TEXT NOT NULL DEFAULT 'direct_link' CHECK (channel IN ('website','direct_link'));" || {
                echo "::error::could not add the channel column"; exit 1; }
            echo "channel added, defaulting every existing row to direct_link — reachable at its own page, just not in the grid (Test-PRD-P0-71-product_channel)."
          fi

      - name: Create the agent bookkeeping tables in an already-populated assets database
        if: inputs.add_agent_bookkeeping_tables
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-assets --remote --yes --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'agent_last_preview'" \
            > /tmp/tbl.json 2>/tmp/tbl.err || {
              cat /tmp/tbl.err; echo "::error::could not read vemians-assets"; exit 1; }

          if python3 -c "import json,sys; r=json.load(open('/tmp/tbl.json')); sys.exit(0 if r[0]['results'] else 1)"; then
            echo "agent_last_preview already exists — nothing to do."
          else
            npx wrangler d1 execute vemians-assets --remote --yes --command "
              CREATE TABLE agent_last_preview (
                id         INTEGER PRIMARY KEY AUTOINCREMENT,
                actor      TEXT NOT NULL,
                batch_kind TEXT NOT NULL CHECK (batch_kind IN ('products', 'customers', 'attached')),
                asset_id   TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );
              CREATE INDEX idx_agent_last_preview_lookup ON agent_last_preview (actor, batch_kind, id DESC);
              CREATE TABLE agent_batch_plan (
                id         TEXT PRIMARY KEY,
                actor      TEXT NOT NULL,
                role       TEXT NOT NULL,
                rows       TEXT NOT NULL,
                done       INTEGER NOT NULL DEFAULT 0,
                total      INTEGER NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );
              CREATE INDEX idx_agent_batch_plan_actor ON agent_batch_plan (actor, created_at DESC);
            " || { echo "::error::could not create the agent bookkeeping tables"; exit 1; }
            echo "agent_last_preview and agent_batch_plan created — spreadsheet previews and batch checklists now survive a redeploy (Test-PRD-P0-183-durable_batch_bookkeeping)."
          fi

      - name: Widen agent_last_preview.batch_kind to also allow 'attached'
        if: inputs.widen_agent_last_preview_batch_kind
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-assets --remote --yes --json \
            --command "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'agent_last_preview'" \
            > /tmp/ddl.json 2>/tmp/ddl.err || {
              cat /tmp/ddl.err; echo "::error::could not read vemians-assets"; exit 1; }

          if python3 -c "import json,sys; r=json.load(open('/tmp/ddl.json'))[0]['results']; sys.exit(1 if not r else (0 if \"'attached'\" in r[0]['sql'] else 1))"; then
            echo "agent_last_preview.batch_kind already allows 'attached' — nothing to do."
          else
            # SQLite cannot ALTER a CHECK constraint in place -- rename, recreate
            # with the wider constraint, copy every existing row across
            # untouched (all satisfy it already, having only ever held
            # 'products'/'customers'), then drop the renamed original.
            npx wrangler d1 execute vemians-assets --remote --yes --command "
              ALTER TABLE agent_last_preview RENAME TO agent_last_preview_pre_attached;
              CREATE TABLE agent_last_preview (
                id         INTEGER PRIMARY KEY AUTOINCREMENT,
                actor      TEXT NOT NULL,
                batch_kind TEXT NOT NULL CHECK (batch_kind IN ('products', 'customers', 'attached')),
                asset_id   TEXT NOT NULL,
                created_at TEXT NOT NULL DEFAULT (datetime('now'))
              );
              CREATE INDEX idx_agent_last_preview_lookup ON agent_last_preview (actor, batch_kind, id DESC);
              INSERT INTO agent_last_preview (id, actor, batch_kind, asset_id, created_at)
                SELECT id, actor, batch_kind, asset_id, created_at FROM agent_last_preview_pre_attached;
              DROP TABLE agent_last_preview_pre_attached;
            " || { echo "::error::could not widen agent_last_preview.batch_kind"; exit 1; }
            echo "agent_last_preview.batch_kind now also allows 'attached', every existing row preserved — a spreadsheet attachment's own asset id now survives an intervening clarifying question, not just an intervening preview confirmation (Test-PRD-P0-183-durable_batch_bookkeeping, revised)."
          fi

      - name: Commit the ids
        run: |
          if git diff --quiet -- ops/wrangler.toml store/wrangler.toml; then
            echo "both wrangler.toml files already correct — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/wrangler.toml store/wrangler.toml
          git commit -m "Resolve D1 database ids from the Cloudflare account

          Replaces the placeholder ids the wrangler.toml files ship with, which
          a deploy rejects with error 10181, using the real ids for this
          account. Covers store/ as well as ops/ — the storefront binds
          catalog-mirror and was left on a placeholder."
          git push

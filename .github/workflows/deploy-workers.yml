# Deploy the storefront and ops Workers to Cloudflare.
#
# Two packages, two Workers, two deploys: `store/` is vemians-storefront and
# `ops/` is vemians-ops. Neither has an --env; each package's wrangler.toml is
# the whole configuration for its own Worker.
#
# Runs on GitHub's infrastructure using CLOUDFLARE_API_TOKEN from repository
# secrets. Nothing here needs a local machine, and the token is never exposed
# to a pull request from a fork (see `pull_request` absence below — this only
# runs on push to main and on manual dispatch).

name: deploy-workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        default: both
        options: [both, storefront, ops]
  push:
    branches: [main]
    paths:
      - "store/**"
      - "ops/**"
      - "shared/**"
      - ".github/workflows/deploy-workers.yml"

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            store/package-lock.json
            ops/package-lock.json

      - run: npm ci
        working-directory: store

      - run: npm ci
        working-directory: ops

      # Fail before touching Cloudflare, not after. A red deploy is worse than
      # a red test because it is already live when you find out.
      - name: Tests
        run: npm test
        working-directory: ops

      # The adapter suite has no package.json of its own — it is library code under
      # shared/, not a deployable. Run it explicitly, or it silently never gates a deploy.
      - name: Commerce adapter tests
        working-directory: .
        run: node --test shared/commerce/square/test/*.test.mjs

      - name: Schema checks
        run: python3 shared/db/verify.py

      - name: Deploy storefront
        if: inputs.target == 'storefront' || inputs.target == 'both' || github.event_name == 'push'
        run: npx wrangler deploy
        working-directory: store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ops
        if: inputs.target == 'ops' || inputs.target == 'both' || github.event_name == 'push'
        run: npx wrangler deploy
        working-directory: ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Where it landed
        run: |
          echo "Storefront and ops deployed."
          echo "Each Worker is live on its *.workers.dev URL immediately."
          echo "Custom Domains (vemians.com, ops.vemians.com) are attached in the"
          echo "dashboard once and persist across deploys — see docs/deploy-cloudflare.md."

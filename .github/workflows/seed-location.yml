# One-time: insert the single row COMMERCE's `location` table needs before
# LOCATION_ID (ops/wrangler.toml) means anything. Nothing creates this row on
# its own — schema.sql only defines the shape, same as `location` in
# shared/db/commerce.sql — so it is done here, once, the same way
# bootstrap-d1/bootstrap-resources handle other one-time account setup.
#
# Idempotent by id: re-running this after the row already exists is a no-op,
# not a duplicate-row error and not a second location competing with the
# first.

name: seed-location

on:
  workflow_dispatch:
    inputs:
      location_id:
        description: The id LOCATION_ID in ops/wrangler.toml will hold
        type: string
        default: main
      location_name:
        description: Human-readable name for this row
        type: string
        default: Vemians

concurrency:
  group: seed-location
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/package-lock.json

      - run: npm ci
        working-directory: ops

      - name: Insert the location row if it is not already there
        working-directory: ops
        env:
          LOCATION_ID: ${{ inputs.location_id }}
          LOCATION_NAME: ${{ inputs.location_name }}
        run: |
          npx wrangler d1 execute vemians-commerce --remote --json \
            --command "INSERT INTO location(id,name) SELECT '$LOCATION_ID','$LOCATION_NAME' WHERE NOT EXISTS (SELECT 1 FROM location WHERE id='$LOCATION_ID')"

      - name: Show every location row now on file
        working-directory: ops
        run: |
          npx wrangler d1 execute vemians-commerce --remote --json \
            --command "SELECT id, name, is_active FROM location"
